  SCREENS.review = (box, st) => {
    const Lx = L();
    if (!isManager()) { back(); return; }
    const date = st.date || today();
    const dn = JD.dayOf(date);
    const touched = (r) => { const d = new Date(r.u); return JD.dayOf(JD.fromDate(d)) === dn || JD.dayOf(r.date) === dn; };
    const cols = [['charges', 'خدمت'], ['payments', 'دریافت'], ['expenses', 'هزینه'], ['appts', 'نوبت']];
    const groups = new Map();
    for (const [col, lbl] of cols) for (const r of Lx.c[col].values()) {
      if (!touched(r)) continue;
      const who = r.ebn || r.bn || 'نامعلوم';
      if (!groups.has(who)) groups.set(who, []);
      groups.get(who).push({ col, lbl, r });
    }
    const line = ({ col, lbl, r }) => {
      const c = r.cid ? Lx.get('clients', r.cid) : null;
      const what = col === 'charges' ? `${r.label || Lx.labelOf(r.svc, r.vid)} · ${toman(r.amount)}` : col === 'payments' ? `${r.method} · ${toman(r.amount)}` : col === 'expenses' ? `${r.cat} · ${toman(r.amount)}` : `${fa(r.time || '')} · ${LG.STATUS[r.status]}`;
      const edits = (r.hist || []).filter((h) => JD.dayOf(JD.fromDate(new Date(h.t))) === dn).map((h) => Object.entries(h.ch).map(([f, [a, b]]) => `${FIELD_FA[f] || f}: ${fmtV(a)} ← ${fmtV(b)}`).join('، ')).join(' | ');
      return `<label class="o-rev${r.void ? ' is-void' : ''}"><input type="checkbox" data-rv="${col}:${esc(r.id)}" ${r.ok ? 'disabled checked' : (col === 'appts' ? '' : 'checked')}>
        <span><b>${lbl}</b> ${esc(c ? Lx.clientName(c) : '')} · ${esc(what)}${r.void ? ` · <b>باطل</b>${r.void.why ? `: ${esc(r.void.why)}` : ''}` : ''}${edits ? `<small>ویرایش امروز: ${esc(edits)}</small>` : ''}${r.ok ? `<small>تأیید ${esc(r.ok.n)}</small>` : ''}</span></label>`;
    };
    box.innerHTML = `${head()}${formTop('بررسی روزانه', 'بیشتر')}${dayBar(date)}
      <div class="form-note">ثبت‌ها و ویرایش‌های این روز به تفکیک هر نفر. موارد درست را تأیید کنید؛ هر ثبتی که بعداً ویرایش شود، دوباره برای بررسی می‌آید.</div>
      ${[...groups.entries()].map(([who, arr]) => `<section class="block"><h2>${esc(who)} <small>${fa(arr.length)} مورد</small></h2>${arr.map(line).join('')}</section>`).join('') || '<div class="empty">در این روز ثبتی نیست.</div>'}`;
    wireDayBar(box, st);
    H.setRbar(groups.size ? [{ label: 'تأیید موارد انتخاب‌شده', onClick: () => {
      const byCol = {};
      $$('[data-rv]:checked:not(:disabled)', box).forEach((x) => { const [col, id] = x.dataset.rv.split(':'); (byCol[col] || (byCol[col] = [])).push(id); });
      let n = 0;
      for (const [col, ids] of Object.entries(byCol)) { Lx.approve(col, ids, user()); n += ids.length; }
      H.toast(n ? `${fa(n)} مورد تأیید شد.` : 'موردی انتخاب نشده.'); render(O.st, true);
    } }] : null);
  };

  // ------------------------------------------------------------------ گزارش ماهانه (مدیر دفتر)
  SCREENS.report = (box, st) => {
    const Lx = L();
    if (!isManager()) { back(); return; }
    const month = st.month || monthOf(today());
    const [from, to] = monthRange(month);
    const center = st.center || 'all';
    const t = Lx.totals(from, to, center);
    const costs = Lx.unitCosts();
    let injN = 0, injRev = 0, injCost = 0, injCostN = 0;
    for (const ch of t.charges) {
      const s = Lx.service(ch.svc);
      if (!s || s.kind !== 'inj' || ch.pkgN) continue;
      injN++; injRev += ch.amount;
      const cst = Lx.costOf(ch, costs);
      if (cst !== null) { injCost += cst; injCostN++; }
    }
    // منبع آشنایی: مراجعان تازه این ماه (اولین خدمت در این ماه) و درآمدشان
    const firstCh = new Map();
    for (const ch of Lx.all('charges')) { const d = JD.dayOf(ch.date); if (!firstCh.has(ch.cid) || d < firstCh.get(ch.cid)) firstCh.set(ch.cid, d); }
    const src = {};
    for (const ch of t.charges) { const c = Lx.get('clients', ch.cid); const k = (c && c.source) || 'نامعلوم'; const o = src[k] || (src[k] = { n: new Set(), neu: new Set(), amount: 0 }); o.n.add(ch.cid); o.amount += ch.amount; if (firstCh.get(ch.cid) >= JD.dayOf(from)) o.neu.add(ch.cid); }
    const debt = Lx.debtors().reduce((a, x) => a - x.b, 0);
    // روند شش ماه: درآمد خدمات بر اساس نوع
    const months = []; for (let i = 5; i >= 0; i--) months.push(JD.addMonths(month, -i));
    const kinds = ['inj', 'diet', 'visit', 'proc', 'other'];
    const trend = Object.fromEntries(kinds.map((k) => [k, months.map(() => 0)]));
    const expT = months.map(() => 0);
    months.forEach((mk, i) => { const [a, b] = monthRange(mk); const tt = Lx.totals(a, b, center); for (const ch of tt.charges) { const s = Lx.service(ch.svc); trend[s ? s.kind : 'other'][i] += ch.amount; } expT[i] = tt.spent; });
    const series = kinds.filter((k) => trend[k].some(Boolean)).map((k, i) => ({ name: LG.KINDS[k], colorIdx: i % 3, color: i >= 3 ? 'other' : undefined, values: trend[k].map((v) => Math.round(v / 1e5) / 10) }));
    const cs = centers();
    const tr = (cells) => `<tr>${cells.map((x) => `<td>${x}</td>`).join('')}</tr>`;
    box.innerHTML = `${head()}${formTop('گزارش ماهانه', 'بیشتر')}${monthBar(month)}
      ${cs.length > 1 ? `<div class="seg full" style="--n:${cs.length + 1}" role="radiogroup" aria-label="مرکز" data-centerseg>${[['all', 'همه'], ...cs.map((c) => [c, c])].map(([v, l]) => `<button type="button" role="radio" data-value="${esc(v)}" aria-checked="${v === center}">${esc(l)}</button>`).join('')}</div>` : ''}
      <div class="kpis o-kpis">
        <div class="kpi"><span>درآمد خدمات</span><b class="money">${toman(t.income, true)}</b><small>${fa(t.charges.length)} مورد · تخفیف ${toman(t.disc, true)}</small></div>
        <div class="kpi"><span>دریافتی</span><b class="money">${toman(t.received, true)}</b><small>${fa(t.payments.length)} مورد</small></div>
        <div class="kpi"><span>مخارج</span><b class="money">${toman(t.spent, true)}</b><small>${fa(t.expenses.length)} مورد</small></div>
        <div class="kpi"><span>دریافتی منهای مخارج</span><b class="money ${t.net < 0 ? 'neg' : ''}">${toman(t.net, true)}</b><small>کل بدهی مراجعان: ${toman(debt, true)}</small></div>
      </div>
      <div id="rp-trend"></div>
      ${injN ? `<section class="block"><h2>تزریق‌ها</h2><div class="form-note">${fa(injN)} تزریق · درآمد ${toman(injRev)}${injCostN ? ` · هزینه دارو ${toman(injCost)} (برای ${fa(injCostN)} تزریق که قیمت خرید دارد) · سود دارویی ${toman(injRev - injCost)} · میانگین سود هر تزریق ${toman((injRev - injCost) / Math.max(1, injN))}` : ' · برای سود هر تزریق، در «موجودی دارو» خرید دارو را با مبلغ ثبت کنید.'}</div></section>` : ''}
      <section class="block"><h2>به تفکیک خدمت</h2><table class="data"><tr><th>خدمت</th><th>تعداد</th><th>مبلغ</th></tr>${Object.values(t.bySvc).sort((a, b) => b.amount - a.amount).map((x) => tr([esc(x.label), fa(x.n), toman(x.amount, true)])).join('') || tr(['—', '—', '—'])}</table></section>
      <section class="block"><h2>روش‌های دریافت</h2><table class="data">${Object.entries(t.byMethod).map(([m, v]) => tr([esc(m), toman(v, true)])).join('') || tr(['—', '—'])}</table></section>
      <section class="block"><h2>مخارج به تفکیک دسته</h2><table class="data">${Object.entries(t.byCat).sort((a, b) => b[1] - a[1]).map(([k, v]) => tr([esc(k), toman(v, true)])).join('') || tr(['—', '—'])}</table></section>
      <section class="block"><h2>منبع آشنایی</h2><div class="form-note">مراجعانی که این ماه خدمت گرفته‌اند؛ «تازه» یعنی اولین خدمتشان در همین ماه بوده است.</div><table class="data"><tr><th>منبع</th><th>مراجع</th><th>تازه</th><th>درآمد</th></tr>${Object.entries(src).sort((a, b) => b[1].amount - a[1].amount).map(([k, o]) => tr([esc(k), fa(o.n.size), fa(o.neu.size), toman(o.amount, true)])).join('') || tr(['—', '—', '—', '—'])}</table></section>
      <section class="block"><h2>ثبت‌ها به تفکیک نفر</h2><table class="data">${Object.entries(t.byUser).map(([k, v]) => tr([esc(k), fa(v)])).join('') || tr(['—', '—'])}</table></section>`;
    if (series.length && root().Charts) {
      const mf = (v) => root().Charts.fmtNum(v, 1);
      const spec = { type: 'bar', title: 'درآمد خدمات در شش ماه اخیر (به تفکیک نوع)', height: 210, categories: months, series, yLabel: 'میلیون تومان', yInt: false,
        catLabel: (k, i, long) => JD.monthLabel(k, long), valFormat: mf, yFormat: mf,
        table: { head: ['ماه', ...series.map((s) => s.name), 'مخارج'], rows: months.map((k, i) => [JD.monthLabel(k, true), ...series.map((s) => toman(s.values[i], true)), toman(expT[i], true)]) },
        legend: series.map((s) => ({ name: s.name, colorIdx: s.colorIdx, color: s.color, kind: 'rect' })), alt: 'درآمد ماهانه به تفکیک نوع خدمت' };
      try { O.charts.push(root().Charts.mount($('#rp-trend', box), spec)); } catch (e) { /* نمودار اختیاری است */ }
    }
    wireMonthBar(box, st);
    box.onclick = (e) => { const seg = e.target.closest('[data-centerseg] [role="radio"]'); if (seg) go(Object.assign({}, st, { center: seg.dataset.value }), true); };
    H.setRbar(null);
  };
  const root = () => window;

  // ------------------------------------------------------------------ تنظیمات دفتر (مدیر)
  SCREENS.lset = (box) => {
    const Lx = L();
    if (!isManager()) { back(); return; }
    const m = Lx.meta;
    box.innerHTML = `${head()}${formTop('تنظیمات دفتر', 'بیشتر')}
      <form class="grid" id="ofm" novalidate>
        ${F.text('l-name', 'نام دفتر', m.name)}
        ${F.text('l-centers', 'مرکزها (با «،» جدا کنید)', (m.centers || []).join('، '), { ph: 'مثلاً بابلسر، جویبار' })}
        ${F.area('l-remind', 'متن یادآوری نوبت ({نام}، {روز}، {تاریخ}، {ساعت}، {مرکز})', m.remindText || '')}
        ${F.area('l-recall', 'متن پیگیری ({نام})', m.recallText || '')}
      </form>
      <section class="block"><h2>افراد این دفتر</h2>${Lx.all('users').map((u) => `<div class="o-past">${esc(u.name)} · ${u.role === 'manager' ? 'مدیر دفتر' : 'منشی'}</div>`).join('') || '<div class="form-note">—</div>'}
        <div class="form-note">برای گوشی تازه (منشی، صاحب دفتر یا گوشی تازه خودتان) کد راه‌اندازی بسازید.</div>
        <div class="row-btns"><button type="button" class="secondary" data-linvite>افزودن منشی یا گوشی</button><button type="button" class="btn-sm" data-lpass>رمز دفتر</button></div></section>`;
    box.addEventListener('click', (ev) => {
      const e = entryOf();
      if (!e) return;
      if (ev.target.closest('[data-linvite]')) inviteDialog([e]);
      if (ev.target.closest('[data-lpass]')) showPass(e);
    });
    const save = () => {
      Lx.put('meta', Object.assign({}, m, { id: 'meta', name: val(box, 'l-name') || m.name, centers: val(box, 'l-centers').split(/[،,]/).map((x) => x.trim()).filter(Boolean),
        remindText: val(box, 'l-remind'), recallText: val(box, 'l-recall') }), user());
      const e = entryOf(); if (e) { e.name = val(box, 'l-name') || e.name; LS.saveCfg(); }
      H.toast('ذخیره شد.'); back();
    };
    H.setRbar([{ label: 'ذخیره', onClick: save }, { label: 'انصراف', cls: 'secondary', onClick: () => back() }]);
  };

  window.Office = {
    init, render, reloadLedgers, forgetLocal, go, setLedger, toman, user, isManager, entryOf, clientPicker, inviteDialog, showPass, passHtml, modal,
    get ledgers() { return O.ledgers; }, get lid() { return O.lid; }, get state() { return O.st; },
    ledger(id) { return O.ledgers.get(id) || null; }, reminderData,
  };
})();

</script>
<script>
/* ---- office-app.js ---- */
/* اپ منشی: فقط نوبت‌ها، صندوق، مراجعان و مخارج دفترهایی که با کد راه‌اندازی به این گوشی داده شده.
   هیچ بخش پزشکی در این اپ نیست و داده پرونده‌ها هیچ‌وقت به این گوشی نمی‌آید. */
(function () {
  'use strict';
  const JD = window.JD, LS = window.LSync, Office = window.Office, Lock = window.Lock;
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const fa = JD.faDigits;
  const CFG_KEY = 'clinic-office-v1';
  const TABS = ['today', 'cash', 'clients', 'more'];
  let toastTimer = 0;
  function toast(msg, ms) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, ms || 3200); }
  function setRbar(buttons) {
    const bar = $('#rbar'), inn = $('#rbar-in');
    inn.innerHTML = '';
    if (!buttons || !buttons.length) { bar.hidden = true; return; }
    for (const b of buttons) { const el = document.createElement('button'); el.type = 'button'; el.className = b.cls || 'primary'; el.textContent = b.label; el.addEventListener('click', b.onClick); inn.appendChild(el); }
    bar.hidden = false;
  }

  // ------------------------------------------------------------------ مسیریابی
  function apply(o) {
    const st = o || { screen: 'today' };
    const configured = LS.configured && (LS.config.ledgers || []).length;
    $('#view-setup').hidden = !!configured;
    $('#view-office').hidden = !configured;
    $('#tabbar').hidden = !configured;
    document.body.classList.toggle('has-tabs', !!configured);
    if (!configured) { setRbar(null); renderSetup(); return; }
    const tab = TABS.includes(st.screen) ? st.screen : (['appt', 'reminders'].includes(st.screen) ? 'today' : (['charge', 'pay', 'review'].includes(st.screen) ? 'cash' : (['client', 'cform'].includes(st.screen) ? 'clients' : 'more')));
    $$('#tabbar [data-tab]').forEach((b) => b.setAttribute('aria-current', b.dataset.tab === tab ? 'page' : 'false'));
    Office.render(st);
  }
  function go(o, replace) { try { if (replace) history.replaceState({ o }, ''); else history.pushState({ o }, ''); } catch (e) { /* بی‌اثر */ } apply(o); }
  function back(fb) { if (history.state && history.state.o && !TABS.includes(history.state.o.screen) && history.length > 1) history.back(); else go(fb || { screen: 'today' }, true); }
  window.addEventListener('popstate', (e) => apply(e.state && e.state.o));

  // ------------------------------------------------------------------ راه‌اندازی با کد
  function renderSetup() {
    const box = $('#view-setup');
    const fromUrl = /[#&]s=/.test(location.hash) ? location.hash.replace(/^#/, '') : '';
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
    const standalone = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
    const iosWarn = isIOS && !standalone ? `<div class="su-ios" role="note"><b>روی آیفون اول اپ را نصب کنید.</b> راه‌اندازی در Safari به اپ نصب‌شده نمی‌رسد:
        <ol class="steps-list"><li>${fromUrl ? 'دکمه «کپی لینک راه‌اندازی» را بزنید.' : 'لینک راه‌اندازی را از پیام کپی کنید.'}</li><li>از دکمه Share گزینه Add to Home Screen را بزنید.</li><li>اپ «نوبت و صندوق» را از صفحه اصلی باز کنید، «چسباندن» را بزنید و کد ۱۰ رقمی را وارد کنید.</li></ol>
        ${fromUrl ? '<div class="row-btns"><button type="button" class="primary" id="su-copy">کپی لینک راه‌اندازی</button></div>' : ''}</div>` : '';
    box.innerHTML = `<div class="view-head"><h2>راه‌اندازی این گوشی</h2></div>${iosWarn}
      <div class="form-note">این اپ نوبت‌ها و صندوق مطب را نگه می‌دارد. برای شروع، از گوشی دکتر (یا مدیر دفتر) «کد راه‌اندازی» بگیرید: یک QR یا لینک، و یک کد ۱۰ رقمی که حضوری گفته می‌شود.</div>
      <section class="block">
        <div class="row-btns" id="su-scanrow" hidden><button type="button" class="primary" id="su-scan">اسکن QR با دوربین</button></div>
        <video id="su-video" class="su-video" hidden muted playsinline></video>
        <div class="field" style="margin-top:10px"><label for="su-p">لینک یا کد راه‌اندازی</label><textarea id="su-p" rows="3" dir="ltr" placeholder="https://…/office.html#s=…">${esc(fromUrl ? location.href : '')}</textarea>
          <button type="button" class="chipbtn" id="su-paste">چسباندن</button></div>
        <div class="field" style="margin-top:10px"><label for="su-c">کد ۱۰ رقمی</label><input id="su-c" inputmode="numeric" dir="ltr" autocomplete="one-time-code"></div>
        <div class="row-btns"><button type="button" class="primary" id="su-ok">راه‌اندازی</button></div>
        <div class="status" id="su-st" role="status" aria-live="polite"></div>
      </section>
      <section class="block"><h2>نصب روی گوشی</h2>
        <div class="form-note"><b>اندروید:</b> بعد از راه‌اندازی، دکمه «نصب روی گوشی» بالای صفحه را بزنید (یا از منوی ⋮ گزینه Install app).<br><b>آیفون:</b> اول از Safari با Share › Add to Home Screen نصب کنید، بعد اپ نصب‌شده را باز کنید و همین‌جا لینک و کد را وارد کنید.</div></section>`;
    const st = (m, ok) => { const el = $('#su-st'); el.textContent = m; el.className = `status ${ok === undefined ? '' : (ok ? 'ok' : 'bad')}`; };
    if (fromUrl) setTimeout(() => $('#su-c').focus(), 100);
    window.QR && window.QR.canScan().then((ok) => { $('#su-scanrow').hidden = !ok; });
    $('#su-scan').onclick = async () => {
      const v = $('#su-video'); v.hidden = false;
      const sc = window.QR.scan(v);
      st('دوربین را روی QR گوشی دکتر بگیرید…');
      try { const text = await sc.done; $('#su-p').value = text; v.hidden = true; st('QR خوانده شد؛ کد ۱۰ رقمی را وارد کنید.', true); $('#su-c').focus(); }
      catch (e) { v.hidden = true; st('دوربین باز نشد؛ لینک را بچسبانید.', false); }
    };
    const cp = $('#su-copy');
    if (cp) cp.onclick = async () => { try { await navigator.clipboard.writeText(location.href); cp.textContent = 'کپی شد'; } catch (e) { window.prompt('لینک را کپی کنید', location.href); } };
    $('#su-paste').onclick = async () => { try { $('#su-p').value = await navigator.clipboard.readText(); } catch (e) { $('#su-p').focus(); st('نگه دارید و «Paste» را بزنید.'); } };
    $('#su-ok').onclick = async () => {
      st('در حال بررسی…');
      try {
        const o = await LS.readSetup($('#su-p').value, $('#su-c').value);
        const cfg = LS.config;
        const sameRepo = !!(cfg.gh && cfg.gh.owner === o.gh.owner && cfg.gh.repo === o.gh.repo);
        if (cfg.gh && cfg.gh.repo && !sameRepo && cfg.ledgers.length) {
          if (!window.confirm('این گوشی به مخزن دیگری وصل است. دفترهای فعلی از این گوشی برداشته و مخزن تازه جایگزین شود؟')) return;
          for (const id of [...Office.ledgers.keys()]) await Office.forgetLocal(id);
          cfg.ledgers = []; cfg.user = null;
        }
        if (!sameRepo || !cfg.gh.token) cfg.gh = o.gh;
        else if (o.gh.token && o.gh.token !== cfg.gh.token) {
          // کد تازه توکن دیگری دارد (مثلاً بعد از عوض شدن توکن): اگر کار می‌کند جایگزین می‌شود؛ اگر گیت‌هاب ردش کرد، توکن فعلی این گوشی می‌ماند
          const old = cfg.gh;
          cfg.gh = Object.assign({}, old, { token: o.gh.token });
          st('در حال بررسی توکن…');
          try { await LS.repoInfo(); } catch (err) { if ([401, 403, 404].includes(err.status)) cfg.gh = old; }
        }
        // کسی که این گوشی را دارد: اگر گوشی از قبل به نام کسی ثبت می‌کرد (مثلاً منشی‌ای که دفتر دوم هم به او داده شده)، همان می‌ماند؛
        // اگر نام کد تازه فرق دارد، پرسیده می‌شود (مثلاً وقتی گوشی به منشی تازه داده شده)
        if (!cfg.user || !cfg.ledgers.length) cfg.user = o.user;
        else if (o.user && o.user.name !== cfg.user.name && window.confirm(`این گوشی تا حالا به نام «${cfg.user.name}» ثبت می‌کرد. از این به بعد به نام «${o.user.name}» ثبت شود؟`)) cfg.user = o.user;
        for (const e of o.ledgers) { const i = cfg.ledgers.findIndex((x) => x.id === e.id); if (i >= 0) cfg.ledgers[i] = e; else cfg.ledgers.push(e); }
        LS.saveCfg();
        try { history.replaceState(null, '', location.pathname); } catch (e) { /* بی‌اثر */ }
        st('در حال دریافت اطلاعات دفتر…');
        await Office.reloadLedgers();
        await Promise.all([...Office.ledgers.values()].map((L) => LS.syncLedger(L, cfg.ledgers.find((x) => x.id === L.id)).catch((err) => { st(err.message, false); })));
        LS.startAuto(() => [...Office.ledgers.values()]);
        toast(`خوش آمدید ${cfg.user.name}.${Lock && !Lock.enabled ? ' برای امنیت، از «بیشتر» قفل اپ را روشن کنید.' : ''}`, 6000);
        go({ screen: 'today' }, true);
      } catch (e) { st(e.message, false); }
    };
  }

  // ------------------------------------------------------------------ تنظیمات این گوشی (پایین «بیشتر»)
  function moreHtml() {
    const cfg = LS.config;
    return `<section class="block"><h2>این گوشی</h2>
      <div class="form-note">کاربر: <b>${esc((cfg.user || {}).name || '—')}</b> · دفترها: ${esc((cfg.ledgers || []).map((e) => `${e.name} (${e.role === 'manager' ? 'مدیر' : 'منشی'})`).join('، '))}</div>
      <div class="row-btns"><button type="button" class="secondary" data-dev="join">افزودن دفتر با کد</button><button type="button" class="secondary" data-dev="lock">${Lock && Lock.enabled ? 'تنظیم قفل' : 'روشن کردن قفل'}</button>
        <button type="button" class="btn-sm" data-dev="install" id="o-install" hidden>نصب روی گوشی</button><button type="button" class="btn-sm danger" data-dev="leave">خروج این گوشی</button></div>
      <div class="form-note" style="margin-top:8px">نسخه اپ: ${esc((window.APP_CONFIG || {}).build || '—')}</div></section>`;
  }
  async function wireMore(e) {
    const b = e.target.closest('[data-dev]');
    if (!b) return;
    const a = b.dataset.dev;
    if (a === 'join') { try { history.replaceState(null, '', location.pathname); } catch (err) { /* بی‌اثر */ } $('#view-office').hidden = true; $('#view-setup').hidden = false; setRbar(null); renderSetup(); }
    if (a === 'lock' && Lock) {
      if (!Lock.enabled) { await Lock.setupFlow(); toast(Lock.enabled ? 'قفل روشن شد.' : 'انجام نشد.'); return; }
      const v = window.confirm('قفل خاموش شود؟ (رمز فعلی پرسیده می‌شود)');
      if (v && await Lock.confirmFlow()) { Lock.disable(); toast('قفل خاموش شد.'); }
    }
    if (a === 'install' && installEvt) { installEvt.prompt(); installEvt = null; b.hidden = true; }
    if (a === 'leave') {
      if (!window.confirm('اتصال این گوشی به دفترها قطع و داده‌شان از این گوشی پاک شود؟ داده‌ها در گیت‌هاب و گوشی‌های دیگر می‌مانند.')) return;
      const pending = () => [...Office.ledgers.values()].reduce((n, L) => n + L.sync.dirty.length, 0);
      if (pending()) { toast('در حال فرستادن تغییرهای این گوشی…'); await LS.runAll(); }
      const pend = pending();
      if (pend && !window.confirm(`${fa(pend)} بخش هنوز فرستاده نشده (اینترنت را بررسی کنید) و با خروج از بین می‌رود. باز هم خارج شود؟`)) return;
      const cfg = LS.config;
      for (const id of [...Office.ledgers.keys()]) await Office.forgetLocal(id);   // داده دفترها از این گوشی پاک می‌شود
      cfg.gh = null; cfg.ledgers = []; cfg.user = null; cfg.active = null; LS.saveCfg();
      location.reload();
    }
  }
  let installEvt = null;
  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); installEvt = e; const b = $('#btn-install'); if (b) b.hidden = false; const o = $('#o-install'); if (o) o.hidden = false; });

  // ------------------------------------------------------------------ شروع
  async function start() {
    if (Lock) Lock.init({ brand: 'نوبت و صندوق', hasPass: () => false });
    await Office.init({
      cfgKey: CFG_KEY, dbName: 'clinic-office', subnav: false, isDoctor: false,
      officeUrl: () => `${location.href.replace(/[#?].*$/, '').replace(/[^/]*$/, '')}office.html`,
      container: () => $('#view-office'), visible: () => !$('#view-office').hidden,
      setRbar, toast, go, back, replaceState: (o) => { try { history.replaceState({ o }, ''); } catch (e) { /* بی‌اثر */ } },
      moreHtml, wireMore,
      emptyHtml: () => 'هنوز دفتری روی این گوشی نیست.',
    });
    $$('#tabbar [data-tab]').forEach((b) => b.addEventListener('click', () => go({ screen: b.dataset.tab }, true)));
    $('#btn-install').addEventListener('click', () => { if (installEvt) { installEvt.prompt(); installEvt = null; $('#btn-install').hidden = true; } });
    const st0 = { screen: 'today' };
    try { history.replaceState({ o: st0 }, ''); } catch (e) { /* بی‌اثر */ }
    // لینک راه‌اندازی (حتی اگر گوشی قبلاً دفتر دیگری دارد، یا اپ باز است و فقط لینک تازه در آن باز شده)
    const setupFromLink = () => { $('#view-office').hidden = true; $('#tabbar').hidden = true; document.body.classList.remove('has-tabs'); $('#view-setup').hidden = false; setRbar(null); renderSetup(); };
    window.addEventListener('hashchange', () => { if (/[#&]s=/.test(location.hash)) setupFromLink(); });
    if (/[#&]s=/.test(location.hash)) setupFromLink(); else apply(st0);
    if ('serviceWorker' in navigator) {
      // روی گوشی‌ای که اپ دکتر هم دارد: کارگزار اپ دکتر حتماً نسخه تازه باشد (نسخه‌های خیلی قدیمی فایل‌های office را نمی‌شناختند)
      navigator.serviceWorker.getRegistration('./').then((r) => { if (r && r.active && /\/sw\.js$/.test(r.active.scriptURL)) r.update().catch(() => {}); }).catch(() => {});
      let had = !!navigator.serviceWorker.controller;
      navigator.serviceWorker.addEventListener('message', (e) => { const b = e.data && e.data.build; if (b && b !== (window.APP_CONFIG || {}).build) toast('نسخه تازه اپ نصب شد؛ اپ را ببندید و دوباره باز کنید.', 9000); });
      navigator.serviceWorker.addEventListener('controllerchange', () => { const c = navigator.serviceWorker.controller; if (had && c) c.postMessage('build?'); had = true; });
    }
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start); else start();
})();

</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('office-sw.js', { scope: './office' }).catch(function () {}); });
}
</script>
</body>
