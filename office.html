<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: یک ستون موبایل‌محور در سه گام (بیمار، برنامه، خروجی)؛ نوار گام‌ها بالا و دکمه اصلی پایین ثابت */
:root {
  --bg: #F1F5F4; --surface: #FFFFFF; --surface-2: #E8EFEE; --ink: #1B2426; --muted: #5A696C; --line: #D3DDDC;
  --teal: #2E6171; --teal-strong: #224B58; --teal-soft: #DCEAED; --on-teal: #FFFFFF;
  --gold: #9C7A12; --gold-soft: #F4EAC6; --carb: #2E6171; --prot: #C9A227; --fat: #6F7F82;
  --ok: #2E7A4C; --ok-soft: #DDF0E4; --warn: #9A5A06; --warn-soft: #FBEBD2; --danger: #B42318; --danger-soft: #FBE1DE;
  --font-body: "Vazirmatn", "Noto Sans Arabic", Tahoma, sans-serif;
  --font-display: "Noto Kufi Arabic", "Vazirmatn", Tahoma, sans-serif;
  --r: 12px; --shadow: 0 1px 2px rgba(20, 40, 45, .06), 0 6px 18px rgba(20, 40, 45, .06);
  /* رنگ نمودارها (اعتبارسنجی‌شده برای کوررنگی و کنتراست): بابلسر/تزریق، جویبار/رژیم، آنلاین */
  --chart-1: #0D819E; --chart-2: #A87B00; --chart-3: #6A4FB5; --chart-other: #8A9799; --chart-grid: #E6ECEB; --chart-axis: #C9D3D2;
  --tabbar-h: 58px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1415; --surface: #162022; --surface-2: #1C292C; --ink: #E5EDED; --muted: #9AAEB0; --line: #2A3B3E;
    --teal: #6CB2C3; --teal-strong: #8AC5D3; --teal-soft: #173339; --on-teal: #0B1A1E;
    --gold: #D9B444; --gold-soft: #3A3116; --carb: #6CB2C3; --prot: #D9B444; --fat: #8D9EA1;
    --ok: #5CC08A; --ok-soft: #173426; --warn: #E8A23A; --warn-soft: #3A2A12; --danger: #F07063; --danger-soft: #3D1C1A;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
    --chart-1: #2C9AB9; --chart-2: #B38600; --chart-3: #8F7FE0; --chart-other: #6F8285; --chart-grid: #22302F; --chart-axis: #34474A;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1415; --surface: #162022; --surface-2: #1C292C; --ink: #E5EDED; --muted: #9AAEB0; --line: #2A3B3E;
  --teal: #6CB2C3; --teal-strong: #8AC5D3; --teal-soft: #173339; --on-teal: #0B1A1E;
  --gold: #D9B444; --gold-soft: #3A3116; --carb: #6CB2C3; --prot: #D9B444; --fat: #8D9EA1;
  --ok: #5CC08A; --ok-soft: #173426; --warn: #E8A23A; --warn-soft: #3A2A12; --danger: #F07063; --danger-soft: #3D1C1A;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  --chart-1: #2C9AB9; --chart-2: #B38600; --chart-3: #8F7FE0; --chart-other: #6F8285; --chart-grid: #22302F; --chart-axis: #34474A;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.7;
  direction: rtl; -webkit-text-size-adjust: 100%; }
.app { max-width: 720px; margin-inline: auto; padding-inline: 16px; padding-block: 0 140px; }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
.num, .tab-num { font-variant-numeric: tabular-nums; }

/* سربرگ */
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 18px 10px; }
.brand h1 { font-size: 21px; font-weight: 800; letter-spacing: 0; color: var(--ink); }
.brand p { margin: 0; font-size: 13px; color: var(--muted); }
.ghost { background: transparent; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 13px;
  cursor: pointer; color: var(--ink); white-space: nowrap; }
.ghost:hover { border-color: var(--teal); }

/* گام‌ها */
.steps { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px 10px; }
.steps-in { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 999px; }
.steps button { border: 0; background: transparent; border-radius: 999px; padding: 8px 6px; cursor: pointer; font-weight: 500;
  font-size: 14px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 6px; }
.steps button .tab-num { width: 20px; height: 20px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px;
  background: var(--surface); color: var(--muted); }
.steps button[aria-selected="true"] { background: var(--teal); color: var(--on-teal); }
.steps button[aria-selected="true"] .tab-num { background: var(--on-teal); color: var(--teal); }
.steps button:disabled { opacity: .45; cursor: not-allowed; }

.notice { display: flex; gap: 10px; align-items: flex-start; background: var(--gold-soft); color: var(--ink); border-radius: var(--r);
  padding: 10px 14px; font-size: 13.5px; margin-block: 4px 12px; }
.notice b { color: var(--gold); }

/* فرم */
section.block { padding-block: 16px; border-bottom: 1px solid var(--line); }
section.block:last-of-type { border-bottom: 0; }
.block h2 { font-size: 15px; font-weight: 700; margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; }
.block h2 small { font-family: var(--font-body); font-weight: 400; font-size: 12.5px; color: var(--muted); }
.grid { display: grid; gap: 10px 12px; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.c2 { grid-column: span 2; } .c3 { grid-column: span 3; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; }
@media (max-width: 460px) { .m3 { grid-column: span 3; } .m6 { grid-column: span 6; } }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field textarea { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 10px;
  background: var(--surface); padding: 8px 12px; outline: none; }
.field textarea { min-height: 48px; resize: vertical; overflow: hidden; line-height: 1.8; font-size: 14px; }
.field input:focus, .field textarea:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.field input[aria-invalid="true"] { border-color: var(--danger); box-shadow: 0 0 0 3px var(--danger-soft); }
.field .err { color: var(--danger); font-size: 12.5px; min-height: 0; }
.unit-in { position: relative; }
.unit-in input { padding-left: 48px; }
.unit-in span { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 12px; color: var(--muted); pointer-events: none; }

.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; background: var(--surface-2); padding: 4px; border-radius: 12px; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 12px; cursor: pointer; font-size: 14px; color: var(--ink); min-height: 36px; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--teal); font-weight: 700; box-shadow: var(--shadow); }
.seg.full { display: grid; grid-template-columns: repeat(var(--n, 3), 1fr); width: 100%; }
.seg:focus-within { outline: 2px solid var(--teal-soft); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 6px; }

.acts { display: grid; gap: 6px; }
.act { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 10px; border: 1px solid var(--line);
  border-radius: 12px; padding: 10px 12px; background: var(--surface); cursor: pointer; text-align: start; width: 100%; }
.act[aria-checked="true"] { border-color: var(--teal); box-shadow: 0 0 0 2px var(--teal-soft); }
.act .dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--line); }
.act[aria-checked="true"] .dot { border: 5px solid var(--teal); }
.act b { font-weight: 700; font-size: 14px; display: block; }
.act small { color: var(--muted); font-size: 12.5px; }
.act .pal { font-size: 12.5px; color: var(--muted); direction: ltr; }

.prefs { display: grid; gap: 8px; }
.pref { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 10px; }
.pref span { font-size: 14px; }
.pref .seg { width: 100%; display: grid; grid-template-columns: repeat(3, 1fr); }

details.adv { margin-top: 4px; }
details.adv summary { cursor: pointer; color: var(--teal); font-size: 14px; padding-block: 6px; }
.sumline { font-size: 12.5px; color: var(--muted); }
.chipbtn { border: 1px dashed var(--teal); color: var(--teal); background: transparent; border-radius: 999px; padding: 2px 10px;
  font-size: 12.5px; cursor: pointer; margin-top: 4px; align-self: flex-start; }

/* نوار پایین */
.bar { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.bar-in { max-width: 720px; margin-inline: auto; display: flex; gap: 10px; align-items: center; }
.primary { flex: 1; border: 0; border-radius: 12px; background: var(--teal); color: var(--on-teal); font-weight: 700; font-size: 16px;
  min-height: 50px; cursor: pointer; }
.primary:hover { background: var(--teal-strong); }
.primary:disabled { opacity: .55; cursor: progress; }
.secondary { border: 1px solid var(--teal); color: var(--teal); background: var(--surface); border-radius: 12px; min-height: 50px;
  padding-inline: 18px; font-weight: 700; cursor: pointer; }
:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }

/* نتایج */
.cards { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); margin-block: 12px; }
.card { background: var(--surface); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); min-width: 0; }
.card.wide { grid-column: span 2; }
.card h3 { font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; font-family: var(--font-body); }
.big { font-size: 26px; font-weight: 800; line-height: 1.3; }
.chip { display: inline-block; border-radius: 999px; padding: 1px 10px; font-size: 12.5px; font-weight: 700; }
.chip.ok { background: var(--ok-soft); color: var(--ok); } .chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.bad { background: var(--danger-soft); color: var(--danger); } .chip.info { background: var(--teal-soft); color: var(--teal); }
.kv { font-size: 13px; color: var(--muted); margin-top: 4px; }
.kv b { color: var(--ink); font-weight: 600; }
.chain { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 4px 8px; margin-top: 6px; }
.chain .n { display: flex; flex-direction: column; align-items: center; }
.chain .n b { font-size: 19px; font-weight: 800; line-height: 1.3; }
.chain .n small { font-size: 11.5px; color: var(--muted); }
.chain .op { font-size: 18px; color: var(--muted); padding-bottom: 14px; }
.chain .n.goal b { color: var(--teal); }
.macro-bar { display: flex; height: 12px; border-radius: 999px; overflow: hidden; margin-block: 8px 6px; background: var(--surface-2); }
.macro-bar i { display: block; height: 100%; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; }
.legend span::before { content: ""; display: inline-block; width: 9px; height: 9px; border-radius: 3px; margin-inline-end: 6px; background: var(--c); }

.tablewrap { overflow-x: auto; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); }
table.plan { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 330px; }
.plan th, .plan td { padding: 8px 4px; text-align: center; border-bottom: 1px solid var(--line); }
.plan thead th { background: var(--teal); color: var(--on-teal); font-weight: 700; font-size: 12.5px; position: sticky; top: 0; }
.plan th[scope="row"] { text-align: start; padding-inline: 10px 4px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.plan td.cell { cursor: pointer; font-weight: 600; }
.plan td.cell.zero { color: var(--muted); font-weight: 400; }
.plan td.cell[aria-selected="true"] { background: var(--teal-soft); outline: 2px solid var(--teal); outline-offset: -2px; }
.plan td.kc { color: var(--muted); font-size: 13px; }
.plan tfoot td, .plan tfoot th { background: var(--surface-2); font-weight: 800; border-bottom: 0; }
.plan tfoot td.kc { color: var(--teal); }
.planmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-top: 10px; font-size: 13.5px; }
.linkbtn { background: none; border: 0; color: var(--teal); cursor: pointer; padding: 0; font-size: 13.5px; text-decoration: underline; text-underline-offset: 3px; }

.warns { display: grid; gap: 6px; margin-block: 12px; }
.warns div { background: var(--warn-soft); color: var(--ink); border-radius: 10px; padding: 8px 12px; font-size: 13.5px; }
.warns div::before { content: "!"; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%;
  background: var(--warn); color: var(--surface); font-weight: 800; font-size: 12px; margin-inline-end: 8px; }

.menu-item { display: grid; gap: 4px; margin-bottom: 10px; }
.menu-item .lab { display: flex; justify-content: space-between; align-items: center; font-size: 13.5px; font-weight: 700; }
.menu-item .lab small { font-weight: 400; color: var(--muted); }
.stale { color: var(--warn); font-size: 12.5px; }

.stepper { position: fixed; inset-inline: 0; bottom: 0; z-index: 12; background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -6px 18px rgba(0, 0, 0, .08); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); }
.stepper-in { max-width: 720px; margin-inline: auto; display: grid; grid-template-columns: 1fr auto auto auto; align-items: center; gap: 10px; }
.stepper .what { font-size: 13.5px; }
.stepper .what b { display: block; font-size: 15px; }
.stepper .val { min-width: 54px; text-align: center; font-size: 22px; font-weight: 800; }
.round { width: 46px; height: 46px; border-radius: 50%; border: 1px solid var(--teal); background: var(--surface); color: var(--teal);
  font-size: 24px; line-height: 1; cursor: pointer; }
.round.fill { background: var(--teal); color: var(--on-teal); }
.closeb { grid-column: 1 / -1; justify-self: start; }

/* خروجی */
.paper { display: grid; place-items: center; background: var(--surface-2); border-radius: var(--r); padding: 16px; margin-block: 12px; }
.paper canvas { width: min(100%, 340px); height: auto; box-shadow: var(--shadow); border-radius: 2px; background: #fff; }
.paper p { margin: 8px 0 0; font-size: 12.5px; color: var(--muted); }
.exports { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.exports button { min-height: 54px; }
.exports .share { grid-column: 1 / -1; }
.top-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
.status { min-height: 24px; font-size: 13.5px; margin-top: 10px; }
.status.ok { color: var(--ok); } .status.bad { color: var(--danger); }
.privacy { font-size: 12.5px; color: var(--muted); margin-top: 14px; }
.copybox { margin-top: 18px; }
.copybox code { display: block; direction: rtl; text-align: right; font-size: 12px; background: var(--surface-2); border-radius: 8px;
  padding: 8px 10px; overflow-x: auto; white-space: pre; user-select: all; }
.empty { text-align: center; color: var(--muted); padding-block: 40px; }
/* بخش‌ها (فقط نسخه مستقل): نوار پایین، پرونده‌ها، آمار، تنظیمات */
.tabbar { position: fixed; inset-inline: 0; bottom: 0; z-index: 14; display: grid; grid-template-columns: repeat(auto-fit, minmax(0, 1fr));
  background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabbar button { border: 0; background: none; min-height: var(--tabbar-h); display: flex; flex-direction: column; align-items: center;
  justify-content: center; gap: 2px; font-size: 12px; color: var(--muted); cursor: pointer; }
.tabbar svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tabbar button[aria-current="page"] { color: var(--teal); font-weight: 700; }
body.has-tabs .bar, body.has-tabs .stepper, body.has-tabs .rbar { bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px)); padding-bottom: 10px; }
body.has-tabs .app { padding-bottom: 200px; }
.rbar { position: fixed; inset-inline: 0; bottom: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.rbar .bar-in > button { flex: 1; }
.view-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 4px 10px; }
.view-head h2 { font-size: 18px; font-weight: 800; }
.backbtn { background: none; border: 0; color: var(--teal); font-size: 14px; cursor: pointer; padding: 6px 0; display: inline-flex; align-items: center; gap: 6px; }
.search { width: 100%; min-height: 44px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 8px 12px; outline: none; }
.search:focus { border-color: var(--teal); box-shadow: 0 0 0 3px var(--teal-soft); }
.rec-tools { display: grid; gap: 8px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 4; background: var(--bg); padding-block: 4px 8px; }
.rec-count { font-size: 12.5px; color: var(--muted); margin-block: 2px 8px; }
.rec-items { display: grid; gap: 8px; }
.rec-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 12px; width: 100%; text-align: start;
  background: var(--surface); border: 0; border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 14px; cursor: pointer; color: var(--ink); }
.rec-item:hover { outline: 1px solid var(--line); }
.rec-name { font-weight: 700; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rec-meta { font-size: 12.5px; color: var(--muted); grid-column: 1; }
.rec-delta { grid-row: 1 / span 2; grid-column: 2; text-align: center; font-weight: 800; font-size: 15px; }
.rec-delta small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); }
.tag { display: inline-block; border-radius: 999px; padding: 0 8px; font-size: 11.5px; font-weight: 700; background: var(--surface-2); color: var(--muted); margin-inline-start: 4px; vertical-align: 1px; }
.tag.inj { background: var(--teal-soft); color: var(--teal); } .tag.diet { background: var(--gold-soft); color: var(--gold); }
.pt-head { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; }
.pt-head h2 { font-size: 19px; font-weight: 800; }
.pt-meta { font-size: 13px; color: var(--muted); margin-top: 2px; }
.pt-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.pt-actions button { min-height: 40px; }
.btn-sm { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 10px; padding: 6px 12px; font-size: 13.5px; cursor: pointer; }
.btn-sm:hover { border-color: var(--teal); }
.btn-sm.danger { color: var(--danger); }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-block: 10px; }
@media (min-width: 560px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.kpi { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 10px 12px; min-width: 0; }
.kpi span { display: block; font-size: 12.5px; color: var(--muted); }
.kpi b { display: block; font-size: 22px; font-weight: 800; line-height: 1.35; }
.kpi small { font-size: 12px; color: var(--muted); }
.chart { min-width: 0; background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 12px 8px; margin-bottom: 10px; }
.chart-title { font-size: 14px; font-weight: 700; font-family: var(--font-body); }
.chart-sub, .chart-note { font-size: 12px; color: var(--muted); }
.chart-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; margin: 6px 0 2px; }
.lg-item { display: inline-flex; align-items: center; gap: 6px; }
.lg-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }

  /** نمایش: «۱۴۰۴/۰۸/۲۰» یا با نام ماه «۲۰ آبان ۱۴۰۴» */
  function show(j, withMonthName) {

    if (!p) return j ? faDigits(j) : '';

<script>
/* ---- charts.js ---- */
/* رسم نمودار روی canvas: خطی (زمانی یا عددی) و ستونی انباشته. یک محور عمودی در هر نمودار.
   همان تابع رسم برای صفحه (با راهنمای شناور و نمای جدول) و برای PDF (با رنگ‌های چاپی) به کار می‌رود. */
(function (root) {
  'use strict';
  const JD = root.JD;
  const FAMILY = '"Vazirmatn", "Noto Sans Arabic", Tahoma, "DejaVu Sans", sans-serif';
  const fa = (s) => JD.faDigits(s);
  function fmtNum(v, dec) {
    if (v === null || v === undefined || Number.isNaN(v)) return '';

    let s = (Math.round(v * p) / p).toFixed(dec ?? 1);

  }

  // ------------------------------------------------------------------ رنگ‌ها
  const PRINT = { surface: '#FFFFFF', ink: '#1B2426', muted: '#5A696C', grid: '#E6ECEB', axis: '#C9D3D2',
    series: ['#0D819E', '#A87B00', '#6A4FB5'], other: '#8A9799', wash: 'rgba(13,129,158,0.10)', tick: 7, label: 7.4, title: 8.2 };

      axis: v('--chart-axis', '#C9D3D2'), series: [v('--chart-1', '#0D819E'), v('--chart-2', '#A87B00'), v('--chart-3', '#6A4FB5')],
      other: v('--chart-other', '#8A9799'), wash: v('--chart-wash', 'rgba(13,129,158,0.10)'), tick: 11.5, label: 12, title: 13 };
  }
  const colorOf = (th, s) => (s.color === 'other' ? th.other : th.series[s.colorIdx || 0]);
  const font = (size, weight) => `${weight || 400} ${size}px ${FAMILY}`;

  // ------------------------------------------------------------------ مقیاس‌ها
  function niceStep(span, count) {
    const raw = span / Math.max(1, count);
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));

  function niceTicks(min, max, count, integer, fixedStep) {
    if (min === max) { const pad = Math.abs(min) * 0.05 || 1; min -= pad; max += pad; }

    if (integer) step = Math.max(1, Math.round(step));

  // تیک‌های زمانی: ابتدای ماه‌های شمسی، یا هفتگی برای بازه کوتاه
  function timeTicks(d0, d1, maxTicks) {
    const span = d1 - d0;
    const out = [];
    if (span <= 50) {
      const step = span <= 20 ? 3 : 7;
      for (let d = Math.ceil(d0); d <= d1; d += step) { const p = JD.split(JD.fromDay(d)); out.push({ x: d, label: `${fa(p[2])} ${JD.MONTHS[p[1] - 1]}` }); }
      return out;
    }

  /** نمودار خطی. spec: {series:[{name, colorIdx|color, points:[{x,y}], step, endLabel}], xType:'time'|'num', xTicks?, yLabel?, yZero?, yInt?} */
  function drawLine(ctx, box, spec, th) {
    const pts = spec.series.flatMap((s) => s.points.filter((p) => p.y !== null && p.y !== undefined));

    let ymin = Math.min(...pts.map((p) => p.y)), ymax = Math.max(...pts.map((p) => p.y));
    if (spec.yZero) ymin = Math.min(0, ymin);
    if (spec.yMin !== undefined) ymin = Math.min(ymin, spec.yMin);
    if (spec.yMax !== undefined) ymax = Math.max(ymax, spec.yMax);
    if (!spec.yZero && ymax - ymin < (spec.minSpan || 0)) { const mid = (ymax + ymin) / 2; ymin = mid - spec.minSpan / 2; ymax = mid + spec.minSpan / 2; }
    const yt = niceTicks(ymin, ymax, box.h < 140 ? 3 : 4, spec.yInt, spec.yStep);
    const { labels, lw } = layoutY(ctx, box, th, spec, yt);
    const endW = spec.series.some((s) => s.endLabel) ? Math.max(...spec.series.map((s) => {
      const last = [...s.points].reverse().find((p) => p.y !== null && p.y !== undefined);
      return last ? measure(ctx, (spec.endFormat || ((v) => fmtNum(v, 1)))(last.y), th.tick, 700) + 10 : 0;
    })) : 6;
    const padT = spec.yLabel ? th.tick * 2.2 : 10, padB = th.tick * 2.4;
    const px0 = box.x + lw + 4, px1 = box.x + box.w - endW, py0 = box.y + padT, py1 = box.y + box.h - padB;
    let xs = pts.map((p) => p.x);
    let x0 = spec.xDomain ? spec.xDomain[0] : Math.min(...xs), x1 = spec.xDomain ? spec.xDomain[1] : Math.max(...xs);
    if (x0 === x1) { x0 -= spec.xType === 'time' ? 7 : 1; x1 += spec.xType === 'time' ? 7 : 1; }

    if (!spec.xDomain) { x0 -= xpad; x1 += xpad; }
    const X = (x) => px0 + (x - x0) / (x1 - x0) * (px1 - px0);
    const Y = (y) => py1 - (y - yt.lo) / (yt.hi - yt.lo) * (py1 - py0);
    // شبکه و محور
    ctx.lineWidth = 1;
    yt.ticks.forEach((t, i) => {
      const y = Math.round(Y(t)) + 0.5;
      ctx.strokeStyle = i === 0 && spec.yZero && t === 0 ? th.axis : th.grid;
      ctx.beginPath(); ctx.moveTo(px0, y); ctx.lineTo(px1, y); ctx.stroke();
      text(ctx, labels[i], px0 - 6, y, { size: th.tick, color: th.muted, align: 'right', dir: 'ltr' });
    });

    ctx.beginPath(); ctx.moveTo(px0, Math.round(py1) + 0.5); ctx.lineTo(px1, Math.round(py1) + 0.5); ctx.stroke();
    const xt = spec.xTicks || (spec.xType === 'time' ? timeTicks(x0, x1, Math.max(2, Math.floor((px1 - px0) / 70))) : niceTicks(x0, x1, 5, true).ticks.filter((t) => t >= x0 && t <= x1).map((t) => ({ x: t, label: fa(t) })));
    let lastRight = -Infinity;
    for (const t of xt) {
      const x = X(t.x);
      if (x < px0 - 1 || x > px1 + 1) continue;
      const w = measure(ctx, t.label, th.tick);
      if (x - w / 2 < lastRight + 6) continue;
      ctx.strokeStyle = th.axis;
      ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, py1); ctx.lineTo(Math.round(x) + 0.5, py1 + 4); ctx.stroke();
      text(ctx, t.label, x, py1 + 6 + th.tick * 0.7, { size: th.tick, color: th.muted });

    ctx.lineWidth = 1;
    yt.ticks.forEach((t, i) => {
      const y = Math.round(Y(t)) + 0.5;
      ctx.strokeStyle = i === 0 ? th.axis : th.grid;
      ctx.beginPath(); ctx.moveTo(px0, y); ctx.lineTo(px1, y); ctx.stroke();
      text(ctx, labels[i], px0 - 6, y, { size: th.tick, color: th.muted, align: 'right', dir: 'ltr' });
    });
    const GAP = 2;
    const bars = [];
    for (let i = 0; i < n; i++) {
      const cx = px0 + slot * (i + 0.5);
      const x = cx - bw / 2;
      let acc = 0;
      const segs = [];
      spec.series.forEach((s, si) => { const v = s.values[i] || 0; if (v > 0) segs.push({ s, si, v }); });
      segs.forEach((g, k) => {
        const yTop = Y(acc + g.v), yBot = Y(acc);
        const top = k === segs.length - 1;
        const hgt = Math.max(0, yBot - yTop - (k > 0 ? GAP : 0));
        const yy = yTop;
        ctx.fillStyle = colorOf(th, g.s);
        if (top) { roundTop(ctx, x, yy, bw, hgt, 4); ctx.fill(); } else ctx.fillRect(x, yy, bw, hgt);
        acc += g.v;
      });
      if (totals[i] > 0 && slot >= measure(ctx, (spec.valFormat || fa)(totals[i]), th.tick) + 4) {
        text(ctx, (spec.valFormat || fa)(totals[i]), cx, Y(totals[i]) - th.tick * 0.8, { size: th.tick, weight: 700, color: th.ink });
      }
      bars.push({ i, cx, x, w: bw, total: totals[i] });
    }
    // برچسب دسته‌ها با فاصله کافی
    let lastRight = -Infinity;
    for (let i = 0; i < n; i++) {
      const lab = spec.catLabel ? spec.catLabel(spec.categories[i], i) : spec.categories[i];
      const cx = px0 + slot * (i + 0.5);
      const w = measure(ctx, lab, th.tick);
      if (cx - w / 2 < lastRight + 4) continue;
      text(ctx, lab, cx, py1 + 6 + th.tick * 0.7, { size: th.tick, color: th.muted });
      lastRight = cx + w / 2;
    }
    if (spec.yLabel) text(ctx, spec.yLabel, box.x, box.y + 1, { size: th.tick, color: th.muted, align: 'left', base: 'top' });
    ctx.restore();

    return L;
  }

  function draw(ctx, box, spec, th) { return spec.type === 'bar' ? drawBars(ctx, box, spec, th) : drawLine(ctx, box, spec, th); }

  // ------------------------------------------------------------------ نمایش در صفحه: بوم + راهنما + راهنمای شناور + جدول
  function el(tag, cls, txt) { const e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }

  function legendFor(spec, th) {
    if (spec.series.length < 2 && !spec.legend) return null;
    const items = spec.legend || spec.series.map((s) => ({ name: s.name, colorIdx: s.colorIdx, color: s.color, kind: spec.type === 'bar' ? 'rect' : 'line' }));
    const box = el('div', 'chart-legend');
    for (const it of items) {
      const span = el('span', 'lg-item');
      const key = el('i', it.kind === 'rect' ? 'lg-rect' : (it.kind === 'dot' ? 'lg-dot' : 'lg-line'));
      key.style.background = it.color === 'other' ? th.other : th.series[it.colorIdx || 0];
      span.appendChild(key); span.appendChild(document.createTextNode(it.name));
      box.appendChild(span);
    }
    return box;
  }

  function tableFor(spec) {
    const det = el('details', 'chart-table');
    det.appendChild(el('summary', null, 'نمایش جدول'));
    const wrap = el('div', 'tablewrap');
    const t = el('table', 'data');
    const head = el('tr');
    const rows = spec.table ? spec.table : null;
    if (rows) {
      rows.head.forEach((h) => head.appendChild(el('th', null, h)));
      t.appendChild(el('thead')).appendChild(head);
      const tb = el('tbody');
      for (const r of rows.rows) { const tr = el('tr'); r.forEach((c) => tr.appendChild(el('td', null, c))); tb.appendChild(tr); }
      t.appendChild(tb);
    }
    wrap.appendChild(t); det.appendChild(wrap);
    return det;
  }

  /** یک نمودار در صفحه. برمی‌گرداند: {update(spec), el} */
  function mount(container, spec0) {
    let spec = spec0;
    container.innerHTML = '';
    container.classList.add('chart');
    const head = el('div', 'chart-head');
    const title = el('h3', 'chart-title', spec.title || '');
    head.appendChild(title);
    if (spec.subtitle) head.appendChild(el('div', 'chart-sub', spec.subtitle));
    container.appendChild(head);
    const legendSlot = el('div');
    container.appendChild(legendSlot);
    const stage = el('div', 'chart-stage');
    const canvas = el('canvas');
    canvas.tabIndex = 0;
    canvas.setAttribute('role', 'img');
    const tip = el('div', 'chart-tip');
    tip.hidden = true;
    stage.appendChild(canvas); stage.appendChild(tip);
    container.appendChild(stage);
    const note = el('div', 'chart-note');
    container.appendChild(note);
    const tableSlot = el('div');
    container.appendChild(tableSlot);
    let layout = null, base = null, hoverIdx = null, th = null;
    const height = () => spec.height || 220;

    function render() {
      th = themeOf(container);
      const w = Math.max(140, Math.floor(stage.clientWidth || container.clientWidth || 300));
      const h = height();
      const dpr = Math.min(3, window.devicePixelRatio || 1);
      canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
      canvas.style.width = `${w}px`; canvas.style.height = `${h}px`;
      const ctx = canvas.getContext('2d');
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      layout = draw(ctx, { x: 0, y: 0, w, h }, spec, th);
      base = document.createElement('canvas'); base.width = canvas.width; base.height = canvas.height;
      base.getContext('2d').drawImage(canvas, 0, 0);
      canvas.setAttribute('aria-label', spec.alt || spec.title || 'نمودار');
      legendSlot.innerHTML = '';
      const lg = legendFor(spec, th); if (lg) legendSlot.appendChild(lg);
      note.textContent = spec.note || ''; note.hidden = !spec.note;
      tableSlot.innerHTML = '';
      if (spec.table) tableSlot.appendChild(tableFor(spec));
      if (hoverIdx !== null) showHover(hoverIdx);
    }

    // نقاط قابل اشاره: برای خطی همه xهای یکتا، برای ستونی هر دسته
    function targets() {
      if (!layout) return [];
      if (layout.type === 'bar') return layout.bars.map((b) => ({ px: b.cx, i: b.i }));
      const xsSet = new Map();
      for (const d of layout.drawn) for (const p of d.sp) if (p.y !== null && p.y !== undefined) xsSet.set(p.x, true);
      return Array.from(xsSet.keys()).sort((a, b) => a - b).map((x) => ({ px: layout.X(x), x }));
    }
    function showHover(idx) {
      const tg = targets();
      if (!tg.length || !layout) { hideHover(); return; }
      idx = Math.max(0, Math.min(tg.length - 1, idx));
      hoverIdx = idx;
      const t = tg[idx];
      const dpr = canvas.width / parseFloat(canvas.style.width);
      const ctx = canvas.getContext('2d');
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.drawImage(base, 0, 0);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const rows = [];
      let headText = '';
      if (layout.type === 'bar') {
        const b = layout.bars[t.i];
        if (b.total > 0) {   // ستون انتخاب‌شده با یک خط دور مشخص می‌شود
          const top = layout.Y(b.total);
          ctx.strokeStyle = th.ink; ctx.lineWidth = 1.5;
          ctx.strokeRect(b.x - 2.5, top - 2.5, b.w + 5, layout.py1 - top + 2.5);
        }
        headText = spec.catLabel ? spec.catLabel(spec.categories[t.i], t.i, true) : spec.categories[t.i];
        for (const s of spec.series) rows.push({ v: (spec.valFormat || fa)(s.values[t.i] || 0), name: s.name, color: colorOf(th, s) });
        if (spec.series.length > 1) rows.push({ v: (spec.valFormat || fa)(b.total), name: 'جمع', color: null });
      } else {
        const x = layout.X(t.x);
        ctx.strokeStyle = th.muted; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(Math.round(x) + 0.5, layout.py0); ctx.lineTo(Math.round(x) + 0.5, layout.py1); ctx.stroke();
        for (const d of layout.drawn) {
          const p = d.sp.find((q) => q.x === t.x && q.y !== null && q.y !== undefined);
          if (!p) continue;
          ctx.beginPath(); ctx.arc(x, layout.Y(p.y), 6, 0, Math.PI * 2);
          ctx.lineWidth = 2; ctx.strokeStyle = th.surface; ctx.stroke();
          ctx.fillStyle = p.colorIdx !== undefined ? th.series[p.colorIdx] : d.col; ctx.fill();
          rows.push({ v: (spec.tipFormat || spec.endFormat || ((vv) => fmtNum(vv, 1)))(p.y, p), name: d.s.name, color: d.col, extra: p.tip });
        }
        headText = spec.xType === 'time' ? JD.show(JD.fromDay(t.x), true) : (spec.xLabelFor ? spec.xLabelFor(t.x) : fa(t.x));
      }
      tip.innerHTML = '';
      tip.appendChild(el('div', 'tip-head', headText));
      for (const r of rows) {
        const line = el('div', 'tip-row');
        if (r.color) { const k = el('i', 'tip-key'); k.style.background = r.color; line.appendChild(k); }
        line.appendChild(el('b', null, r.v));
        line.appendChild(el('span', null, r.name));
        tip.appendChild(line);
        if (r.extra) tip.appendChild(el('div', 'tip-extra', r.extra));
      }
      tip.hidden = false;
      const sw = stage.clientWidth;
      const tw = tip.offsetWidth;
      let left = t.px + 12;
      if (left + tw > sw - 4) left = t.px - tw - 12;
      tip.style.left = `${Math.max(4, left)}px`;
      tip.style.top = '6px';
    }
    function hideHover() {
      hoverIdx = null; tip.hidden = true;
      if (base) { const ctx = canvas.getContext('2d'); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.drawImage(base, 0, 0); }
    }
    function nearest(clientX) {
      const r = canvas.getBoundingClientRect();
      const x = clientX - r.left;
      const tg = targets();
      let best = -1, bd = Infinity;
      tg.forEach((t, i) => { const d = Math.abs(t.px - x); if (d < bd) { bd = d; best = i; } });
      return best;
    }
    canvas.addEventListener('pointermove', (e) => { const i = nearest(e.clientX); if (i >= 0) showHover(i); });
    canvas.addEventListener('pointerdown', (e) => { const i = nearest(e.clientX); if (i >= 0) showHover(i); });
    canvas.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') hideHover(); });
    canvas.addEventListener('focus', () => showHover(hoverIdx ?? targets().length - 1));
    canvas.addEventListener('blur', hideHover);
    canvas.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { showHover((hoverIdx ?? 0) - 1); e.preventDefault(); }
      else if (e.key === 'ArrowRight') { showHover((hoverIdx ?? -1) + 1); e.preventDefault(); }
      else if (e.key === 'Escape') hideHover();
    });
    let ro = null;
    if (window.ResizeObserver) { let lastW = 0; ro = new ResizeObserver(() => { const w = stage.clientWidth; if (w && Math.abs(w - lastW) > 2) { lastW = w; render(); } }); ro.observe(stage); }
    const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
    const onScheme = () => render();
    if (mq && mq.addEventListener) mq.addEventListener('change', onScheme);
    render();
    return {
      el: container,
      update(s) { spec = s; title.textContent = s.title || ''; hoverIdx = null; tip.hidden = true; render(); },
      render,
      destroy() { if (ro) ro.disconnect(); if (mq && mq.removeEventListener) mq.removeEventListener('change', onScheme); container.innerHTML = ''; },
    };
  }

  root.Charts = { draw, drawLine, drawBars, mount, themeOf, PRINT, fmtNum, timeTicks, niceTicks };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
/* ---- lock.js ---- */
/* قفل اپ: رمز ۴ تا ۶ رقمی، اثر انگشت یا چهره (اگر گوشی پشتیبانی کند)، قفل خودکار پس از چند دقیقه در پس‌زمینه،
   و پوشاندن صفحه هنگام رفتن اپ به پس‌زمینه. این قفل جلوی باز کردن اپ را می‌گیرد؛ قفل صفحه خود گوشی را هم روشن نگه دارید.
   رمز هرگز ذخیره نمی‌شود، فقط چکیده PBKDF2 آن. راه‌های باز کردن در صورت فراموشی: کد بازیابی یا رمز داده‌های همگام‌سازی. */
(function (root) {
  'use strict';
  const KEY = (root.APP_CONFIG && root.APP_CONFIG.lockKey) || 'diet-planner-lock-v1';
  const ITER = 120000;
  const TIMEOUTS = [[0, 'فوری'], [60, '۱ دقیقه'], [300, '۵ دقیقه'], [900, '۱۵ دقیقه']];
  const STANDALONE = !(root.claude && typeof root.claude.use === 'function');
  const te = new TextEncoder();
  const FA = '۰۱۲۳۴۵۶۷۸۹';
  const fa = (s) => String(s).replace(/\d/g, (d) => FA[d]);
  const latin = (s) => String(s).replace(/[۰-۹]/g, (d) => FA.indexOf(d)).replace(/[٠-٩]/g, (d) => '٠١٢٣٤٥٦٧٨٩'.indexOf(d));
  function b64(u8) { let s = ''; for (let i = 0; i < u8.length; i++) s += String.fromCharCode(u8[i]); return btoa(s); }
  function unb64(s) { const b = atob(s); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  const rand = (n) => crypto.getRandomValues(new Uint8Array(n));

  function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null') || {}; } catch (e) { return {}; } }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(cfg)); } catch (e) { /* بی‌اثر */ } }
  let cfg = load();
  let hooks = { checkPass: null, hasPass: () => false, onUnlock: null, brand: 'برنامه‌ساز رژیم' };

  async function digest(secret, saltB64) {
    const base = await crypto.subtle.importKey('raw', te.encode(String(secret)), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: unb64(saltB64), iterations: ITER }, base, 256);
    return b64(new Uint8Array(bits));
  }
  function same(a, b) { if (!a || !b || a.length !== b.length) return false; let x = 0; for (let i = 0; i < a.length; i++) x |= a.charCodeAt(i) ^ b.charCodeAt(i); return x === 0; }
  const enabled = () => !!(STANDALONE && cfg.on && cfg.hash && cfg.salt);
  function recoveryCode() { return Array.from(rand(12), (x) => String(x % 10)).join('').replace(/(\d{4})(?=\d)/g, '$1-'); }
  const normCode = (s) => latin(s).replace(/\D/g, '');

  // ------------------------------------------------------------------ تنظیم
  async function setPin(pin) {
    const salt = b64(rand(16));
    cfg.salt = salt; cfg.hash = await digest(pin, salt); cfg.len = String(pin).length;
    cfg.fails = 0; cfg.until = 0;
  }
  /** روشن کردن قفل؛ کد بازیابی برمی‌گرداند که باید یادداشت شود */
  async function enable(pin) {
    await setPin(pin);
    const code = recoveryCode();
    cfg.rsalt = b64(rand(16)); cfg.rhash = await digest(normCode(code), cfg.rsalt);
    if (cfg.timeout === undefined) cfg.timeout = 300;
    cfg.on = true; save();
    return code;
  }
  function disable() { cfg = { timeout: cfg.timeout }; save(); hideUi(); }
  async function verify(pin) {
    if (!enabled()) return true;
    if (cfg.until && Date.now() < cfg.until) return false;
    const ok = same(await digest(pin, cfg.salt), cfg.hash);
    if (ok) { cfg.fails = 0; cfg.until = 0; } else {
      cfg.fails = (cfg.fails || 0) + 1;
      if (cfg.fails % 5 === 0) cfg.until = Date.now() + 30000 * Math.pow(2, Math.floor(cfg.fails / 5) - 1);
    }
    save();
    return ok;
  }
  async function verifyRecovery(code) { return !!(cfg.rhash && same(await digest(normCode(code), cfg.rsalt), cfg.rhash)); }
  function setTimeoutSec(sec) { cfg.timeout = +sec; save(); }

  // ------------------------------------------------------------------ اثر انگشت (WebAuthn؛ فقط روی همین گوشی)
  async function bioAvailable() {
    if (!root.isSecureContext || !root.PublicKeyCredential || !navigator.credentials) return false;
    try { return await root.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch (e) { return false; }
  }
  async function enrollBio() {
    const cred = await navigator.credentials.create({ publicKey: {
      challenge: rand(32), rp: { name: 'قفل اپ' },
      user: { id: rand(16), name: 'app-lock', displayName: 'قفل اپ' },
      pubKeyCredParams: [{ type: 'public-key', alg: -7 }, { type: 'public-key', alg: -257 }],
      authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required', residentKey: 'discouraged', requireResidentKey: false },
      timeout: 60000, attestation: 'none',
    } });

  }
  function removeBio() { delete cfg.cred; save(); }
  async function bioUnlock() {
    if (!cfg.cred) return false;
    const a = await navigator.credentials.get({ publicKey: {
      challenge: rand(32), allowCredentials: [{ type: 'public-key', id: unb64(cfg.cred) }], userVerification: 'required', timeout: 60000,
    } });
    const ad = new Uint8Array(a.response.authenticatorData);
    return ad.length > 32 && (ad[32] & 0x04) !== 0;   // تأیید کاربر (اثر انگشت، چهره یا قفل صفحه گوشی) انجام شده
  }

  // ------------------------------------------------------------------ صفحه قفل
  // حالت‌ها: unlock (باز کردن یا تأیید رمز فعلی)، setup1/setup2 (رمز تازه)، showcode (کد بازیابی)، forgot
  let el = null, mode = 'unlock', entry = '', firstPin = '', shownCode = '', busy = false, hiddenAt = 0, autoBioTried = false;
  let flow = null;   // {kind: 'confirm'|'setup'|'recover', resolve, cancelable}
  const html = document.documentElement;
  function build() {
    if (el) return el;
    el = document.createElement('div');
    el.className = 'lockscreen'; el.id = 'lockscreen'; el.hidden = true;
    el.setAttribute('role', 'dialog'); el.setAttribute('aria-modal', 'true'); el.setAttribute('aria-labelledby', 'lk-title');
    el.innerHTML = `<div class="lk-in">
      <div class="lk-brand">${hooks.brand}</div>
      <h2 class="lk-title" id="lk-title"></h2>
      <div class="lk-dots" id="lk-dots" aria-hidden="true"></div>
      <div class="lk-msg" id="lk-msg" role="status" aria-live="polite"></div>
      <div class="lk-pad" id="lk-pad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((d) => `<button type="button" data-k="${d}">${fa(d)}</button>`).join('')}
        <button type="button" data-k="bio" id="lk-bio" aria-label="اثر انگشت یا چهره"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4a8 8 0 0 0-8 8v1M20 12a8 8 0 0 0-3-6.2M8 20.5c1.5-2 2-4.3 2-8.5a2 2 0 1 1 4 0c0 3.2-.4 5.6-1.6 8M16 19c.6-1.8 1-4 1-7M7 16.5c.6-1.4 1-2.8 1-4.5"/></svg></button>
        <button type="button" data-k="ok" id="lk-ok">تأیید</button>
        <button type="button" data-k="0">${fa(0)}</button>
        <button type="button" data-k="del" aria-label="پاک کردن">⌫</button></div>
      <div class="lk-alt" id="lk-alt"></div>
    </div>`;
    document.body.appendChild(el);
    el.addEventListener('click', (e) => {
      const b = e.target.closest('[data-k]');
      if (b) { key(b.dataset.k); return; }
      const a = e.target.closest('[data-act]');
      if (a) act(a.dataset.act);
    });
    document.addEventListener('keydown', (e) => {
      if (!el || el.hidden || (e.target.closest && e.target.closest('input'))) return;
      const d = latin(e.key);
      if (/^\d$/.test(d)) { key(d); e.preventDefault(); } else if (e.key === 'Backspace') { key('del'); e.preventDefault(); } else if (e.key === 'Enter') { key('ok'); e.preventDefault(); }
    });
    return el;
  }
  function msg(t, bad) { if (!el) return; const m = el.querySelector('#lk-msg'); m.textContent = t || ''; m.className = `lk-msg${bad ? ' bad' : ''}`; }
  function dots() {
    const n = mode === 'unlock' ? (cfg.len || 4) : Math.max(4, entry.length);
    el.querySelector('#lk-dots').innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < entry.length ? 'on' : ''}"></i>`).join('');
  }
  function render() {
    build();
    const T = { unlock: flow && flow.kind === 'confirm' ? 'رمز فعلی قفل را وارد کنید' : 'رمز قفل را وارد کنید', setup1: 'یک رمز ۴ تا ۶ رقمی انتخاب کنید',
      setup2: 'همان رمز را دوباره وارد کنید', showcode: 'کد بازیابی را یادداشت کنید', forgot: 'باز کردن بدون رمز قفل' };
    el.querySelector('#lk-title').textContent = T[mode];
    const pad = el.querySelector('#lk-pad'), alt = el.querySelector('#lk-alt'), dotsEl = el.querySelector('#lk-dots');
    const padMode = ['unlock', 'setup1', 'setup2'].includes(mode);
    pad.hidden = !padMode; dotsEl.hidden = !padMode;
    // خانه پایین‌چپ صفحه‌کلید: در باز کردن اثر انگشت (اگر فعال است)، در گذاشتن رمز دکمه تأیید
    el.querySelector('#lk-ok').hidden = mode === 'unlock';
    el.querySelector('#lk-bio').hidden = mode !== 'unlock';
    el.querySelector('#lk-bio').style.visibility = cfg.cred ? 'visible' : 'hidden';
    const cancel = flow && flow.cancelable ? '<button type="button" class="linkbtn" data-act="cancel">انصراف</button>' : '';
    if (mode === 'unlock') {
      alt.innerHTML = flow && flow.kind === 'confirm' ? cancel : '<button type="button" class="linkbtn" data-act="forgot">رمز را فراموش کرده‌اید؟</button>';
    } else if (mode === 'setup1' || mode === 'setup2') {
      alt.innerHTML = cancel;
    } else if (mode === 'showcode') {
      alt.innerHTML = `<div class="lk-code" dir="ltr">${fa(shownCode)}</div>
        <p class="lk-note">اگر رمز قفل را فراموش کنید، با این کد اپ باز می‌شود. آن را بیرون از این گوشی بنویسید (مثلاً روی کاغذ).</p>
        <div class="lk-btns"><button type="button" class="primary" data-act="codeok">یادداشت کردم</button></div>
        <div class="lk-btns" id="lk-bio-offer" hidden><button type="button" class="secondary" data-act="enrollbio">اثر انگشت هم فعال شود</button></div>`;
      bioAvailable().then((ok) => { const o = el.querySelector('#lk-bio-offer'); if (o) o.hidden = !ok || !!cfg.cred; });
    } else if (mode === 'forgot') {
      const pass = hooks.hasPass();
      alt.innerHTML = `<div class="field"><label for="lk-rec">کد بازیابی ۱۲ رقمی</label><input id="lk-rec" inputmode="numeric" dir="ltr" autocomplete="off"></div>
        ${pass ? '<div class="field" style="margin-top:8px"><label for="lk-pass">یا رمز داده‌های همگام‌سازی</label><input id="lk-pass" type="password" autocomplete="off"></div>' : ''}
        <div class="lk-btns"><button type="button" class="primary" data-act="recover">باز کردن</button><button type="button" class="secondary" data-act="back">برگشت</button></div>`;
      setTimeout(() => { const i = el.querySelector('#lk-rec'); if (i) i.focus(); }, 30);
    }
    dots();
  }
  function showUi() { build(); el.hidden = false; html.classList.add('locked'); html.classList.remove('lk-cover'); }
  function hideUi() { if (el) el.hidden = true; html.classList.remove('locked', 'lk-cover'); entry = ''; firstPin = ''; }
  function endFlow(result) { const f = flow; flow = null; hideUi(); if (f && f.resolve) f.resolve(result); }

  async function key(k) {
    if (busy) return;
    if (k === 'bio') { if (mode === 'unlock' && cfg.cred) tryBio(); return; }
    if (k === 'del') { entry = entry.slice(0, -1); msg(''); dots(); return; }
    if (k === 'ok') { if (mode === 'setup1' || mode === 'setup2') submit(); return; }
    if (!/^\d$/.test(k) || entry.length >= 6 || !['unlock', 'setup1', 'setup2'].includes(mode)) return;
    entry += k; msg(''); dots();
    if (mode === 'unlock' && entry.length === (cfg.len || 4)) submit();
  }
  const waitText = () => `چند بار اشتباه وارد شد؛ ${fa(Math.ceil((cfg.until - Date.now()) / 1000))} ثانیه دیگر دوباره امتحان کنید.`;
  async function submit() {
    if (mode === 'unlock') {
      if (cfg.until && Date.now() < cfg.until) { msg(waitText(), true); entry = ''; dots(); return; }
      busy = true;
      const ok = await verify(entry);
      busy = false;
      if (ok) { success(); return; }
      entry = ''; dots();
      const d = el.querySelector('#lk-dots'); d.classList.add('shake'); setTimeout(() => d.classList.remove('shake'), 400);
      msg(cfg.until && Date.now() < cfg.until ? waitText() : 'رمز درست نیست.', true);
      return;
    }
    if (entry.length < 4) { msg('رمز باید دست‌کم ۴ رقم باشد.', true); return; }
    if (mode === 'setup1') { firstPin = entry; entry = ''; mode = 'setup2'; render(); return; }
    if (mode === 'setup2') {
      if (entry !== firstPin) { firstPin = ''; entry = ''; mode = 'setup1'; render(); msg('دو رمز یکی نبودند؛ دوباره انتخاب کنید.', true); return; }
      busy = true;
      if (cfg.on && cfg.rhash) { await setPin(entry); save(); busy = false; finishSetup(); return; }   // فقط تغییر رمز؛ کد بازیابی همان می‌ماند
      shownCode = await enable(entry);

      mode = 'showcode'; render();
    }
  }
  function finishSetup() {
    if (flow && flow.kind === 'recover') { flow = null; hideUi(); if (hooks.onUnlock) hooks.onUnlock(); return; }
    endFlow(true);
  }
  function success() {
    if (flow && flow.kind === 'confirm') { endFlow(true); return; }
    hideUi(); autoBioTried = false;
    if (hooks.onUnlock) hooks.onUnlock();
  }
  async function tryBio() {
    try {
      busy = true;
      const ok = await bioUnlock();
      busy = false;
      if (ok) success(); else msg('تأیید انجام نشد؛ رمز را وارد کنید.', true);
    } catch (e) { busy = false; msg(e && e.name === 'NotAllowedError' ? 'لغو شد؛ رمز را وارد کنید یا دوباره اثر انگشت را بزنید.' : 'اثر انگشت در دسترس نیست؛ رمز را وارد کنید.', true); }
  }
  async function act(a) {
    if (a === 'forgot') { mode = 'forgot'; render(); return; }
    if (a === 'back') { mode = 'unlock'; entry = ''; render(); return; }
    if (a === 'cancel') { endFlow(false); return; }
    if (a === 'codeok') { finishSetup(); return; }
    if (a === 'enrollbio') {
      try { await enrollBio(); msg('اثر انگشت فعال شد.'); el.querySelector('#lk-bio-offer').hidden = true; } catch (e) { msg('فعال کردن اثر انگشت انجام نشد؛ بعداً از تنظیمات امتحان کنید.', true); }
      return;
    }
    if (a === 'recover') {
      const code = (el.querySelector('#lk-rec') || {}).value || '';
      const pass = (el.querySelector('#lk-pass') || {}).value || '';
      busy = true; msg('در حال بررسی…');
      let ok = false;
      try {
        if (normCode(code).length >= 12) ok = await verifyRecovery(code);
        if (!ok && pass && hooks.checkPass) ok = await hooks.checkPass(pass);
      } catch (e) { ok = false; }
      busy = false;
      if (!ok) { msg(pass && !normCode(code) ? 'رمز داده‌ها درست نیست (اگر روی گوشی ذخیره نشده، اینترنت لازم است).' : 'کد بازیابی درست نیست.', true); return; }
      cfg.fails = 0; cfg.until = 0; save();
      flow = { kind: 'recover', cancelable: false };   // بلافاصله رمز قفل تازه
      mode = 'setup1'; entry = ''; firstPin = '';
      render(); msg('قفل باز شد؛ یک رمز تازه انتخاب کنید.');
    }
  }
  function lockNow() {
    if (!enabled()) return;
    flow = null; mode = 'unlock'; entry = '';
    showUi(); render();
    if (cfg.cred && !autoBioTried) { autoBioTried = true; setTimeout(() => { if (mode === 'unlock' && el && !el.hidden) tryBio(); }, 250); }
  }
  /** روشن کردن یا تغییر رمز از تنظیمات؛ true اگر انجام شد */
  function setupFlow() {
    return new Promise((resolve) => { flow = { kind: 'setup', resolve, cancelable: true }; mode = 'setup1'; entry = ''; firstPin = ''; showUi(); render(); });
  }
  /** تأیید رمز فعلی پیش از کارهای حساس (خاموش کردن قفل، تغییر رمز) */
  function confirmFlow() {
    if (!enabled()) return Promise.resolve(true);
    return new Promise((resolve) => { flow = { kind: 'confirm', resolve, cancelable: true }; mode = 'unlock'; entry = ''; showUi(); render(); });
  }

  function init(h) {
    hooks = Object.assign(hooks, h || {});
    if (!STANDALONE) { html.classList.remove('locked'); return; }
    if (enabled()) lockNow(); else html.classList.remove('locked');
    document.addEventListener('visibilitychange', () => {
      if (!enabled()) return;
      if (document.visibilityState === 'hidden') {
        hiddenAt = Date.now();
        if (!el || el.hidden) html.classList.add('lk-cover');   // در فهرست برنامه‌های اخیر محتوا دیده نشود
      } else if (!el || el.hidden) {
        if (Date.now() - hiddenAt >= (cfg.timeout ?? 300) * 1000) lockNow();
        else html.classList.remove('lk-cover');
      }
    });
  }

  root.Lock = {
    TIMEOUTS, init, lockNow, setupFlow, confirmFlow, disable, bioAvailable, enrollBio, removeBio,
    setTimeout: setTimeoutSec,
    get enabled() { return enabled(); },
    get bio() { return !!cfg.cred; },
    get timeout() { return cfg.timeout ?? 300; },
    get standalone() { return STANDALONE; },
  };
})(typeof window !== 'undefined' ? window : globalThis);

<script>
/* ---- ledger.js ---- */
/* دفترهای مطب (نوبت، صندوق، مخارج، موجودی): مدل داده، ثبت چه‌کسی/کی، محاسبه‌ها و ذخیره روی گوشی.
   هر دفتر (مثلاً «تغذیه و لاغری» یا «زیبایی») داده جدا و رمز جدا دارد. هیچ داده پزشکی (وزن، رژیم، سابقه) در دفتر نیست.
   رکوردها حذف واقعی نمی‌شوند: «باطل» می‌شوند (با دلیل و نام باطل‌کننده) تا حساب‌ها قابل پیگیری بمانند. */
(function (root) {
  'use strict';
  const JD = root.JD || (typeof require === 'function' ? require('./jdate.js') : null);
  const FORMAT = 'clinic-ledger';
  const VERSION = 1;
  const COLS = ['meta', 'users', 'services', 'clients', 'appts', 'charges', 'payments', 'expenses', 'recurring', 'items', 'moves'];
  const BASE_COLS = ['meta', 'users', 'services', 'recurring', 'items'];
  const DATED = ['appts', 'charges', 'payments', 'expenses', 'moves'];
  const METHODS = ['نقد', 'کارتخوان', 'کارت به کارت', 'آنلاین', 'سایر'];
  const EXP_CATS = ['خرید دارو', 'لوازم مصرفی', 'اجاره', 'حقوق و دستمزد', 'قبوض', 'تبلیغات', 'سهم کلینیک', 'تعمیرات', 'سایر'];
  const STATUS = { booked: 'رزرو', arrived: 'حاضر', done: 'انجام شد', cancel: 'لغو', noshow: 'نیامد' };
  const KINDS = { inj: 'تزریق', visit: 'ویزیت', diet: 'رژیم', proc: 'اقدام', other: 'سایر' };
  const HIST_KEEP = 8;
  const now = () => Date.now();
  const txt = (v) => (v === null || v === undefined ? '' : String(v).replace(/\s+/g, ' ').trim());
  function num(v) {
    if (v === null || v === undefined || v === '') return null;
    if (typeof v === 'number') return Number.isFinite(v) ? v : null;
    const s = JD.latinDigits(String(v)).replace(/[٬,\s]/g, '').replace(/٫/g, '.');
    if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
    return parseFloat(s);
  }
  const money = (v) => { const n = num(v); return n === null ? null : Math.round(n); };
  function newId() {
    if (root.crypto && typeof root.crypto.randomUUID === 'function') return root.crypto.randomUUID();
    const b = new Uint8Array(16);

    return Array.from(b, (x) => x.toString(16).padStart(2, '0')).join('');
  }
  function stable(o) { return JSON.stringify(o, Object.keys(o).sort()); }
  const live = (r) => r && !r.void && !r.del;
  // زمان ویرایش همیشه بعد از نسخه قبلی همان رکورد است، حتی اگر ساعت این گوشی عقب باشد (وگرنه در همگام‌سازی، ویرایش تازه گم می‌شد)
  const stampAfter = (old) => Math.max(now(), ((old && old.u) || 0) + 1);

  // ------------------------------------------------------------------ نرمال‌سازی هر مجموعه (فیلدهای ناشناخته حفظ می‌شوند)
  const TIME_RE = /^([01]?\d|2[0-3]):([0-5]\d)$/;
  function normTime(t) { const m = TIME_RE.exec(JD.latinDigits(txt(t))); return m ? `${m[1].padStart(2, '0')}:${m[2]}` : ''; }
  function normDisc(d) {
    if (!d) return null;
    const v = num(d.v);
    if (!v) return null;
    return { t: d.t === 'pct' ? 'pct' : 'amt', v: d.t === 'pct' ? Math.min(100, Math.max(0, v)) : Math.max(0, Math.round(v)), why: txt(d.why) };
  }
  const NORM = {
    meta: (r) => ({ name: txt(r.name) || 'دفتر', centers: Array.isArray(r.centers) ? r.centers.map(txt).filter(Boolean) : [], recallText: txt(r.recallText),
      remindText: txt(r.remindText), currency: 'toman', linked: !!r.linked }),
    users: (r) => ({ name: txt(r.name) || 'کاربر', role: r.role === 'manager' ? 'manager' : 'staff' }),
    services: (r) => ({ name: txt(r.name) || 'خدمت', kind: KINDS[r.kind] ? r.kind : 'other', drug: txt(r.drug), price: money(r.price) ?? 0, dur: num(r.dur) || 15,
      visitType: txt(r.visitType), active: r.active !== false, order: num(r.order) ?? 0,
      variants: Array.isArray(r.variants) ? r.variants.map((v) => ({ id: v.id || newId(), label: txt(v.label) || '—', dose: num(v.dose), price: money(v.price) ?? 0, active: v.active !== false })) : [] }),
    clients: (r) => {
      const age = num(r.age);
      return { first: txt(r.first), last: txt(r.last), phone: txt(r.phone), fileNo: num(r.fileNo), puid: txt(r.puid), source: txt(r.source),
        sex: r.sex === 'm' || r.sex === 'f' ? r.sex : '', age: age !== null && age > 0 && age < 120 ? Math.round(age) : null, ageAt: age !== null ? (JD.parse(r.ageAt) || '') : '',
        disc: normDisc(r.disc), note: txt(r.note) };
    },
    appts: (r) => ({ cid: txt(r.cid), date: JD.parse(r.date) || JD.today(), time: normTime(r.time), dur: num(r.dur) || 15, center: txt(r.center),
      mode: r.mode === 'آنلاین' ? 'آنلاین' : 'حضوری', svc: txt(r.svc), vid: txt(r.vid), status: STATUS[r.status] ? r.status : 'booked', note: txt(r.note) }),
    charges: (r) => {
      const qty = num(r.qty) || 1, unit = money(r.unit) ?? 0, disc = normDisc(r.disc);
      const gross = unit * qty;
      const off = !disc ? 0 : disc.t === 'pct' ? Math.round(gross * disc.v / 100) : Math.min(gross, disc.v);
      const pkg = txt(r.pkg);
      return { cid: txt(r.cid), date: JD.parse(r.date) || JD.today(), svc: txt(r.svc), vid: txt(r.vid), label: txt(r.label), qty, unit, disc,
        amount: pkg ? 0 : Math.max(0, gross - off), center: txt(r.center), appt: txt(r.appt), visit: txt(r.visit), pkgN: num(r.pkgN) || null, pkg,
        auto: !!r.auto, drug: txt(r.drug), dose: num(r.dose), note: txt(r.note) };
    },
    payments: (r) => ({ cid: txt(r.cid), date: JD.parse(r.date) || JD.today(), amount: Math.max(0, money(r.amount) ?? 0), method: METHODS.includes(r.method) ? r.method : 'نقد',
      kind: r.kind === 'dep' || r.kind === 'ref' ? r.kind : 'pay', appt: txt(r.appt), center: txt(r.center), note: txt(r.note) }),
    expenses: (r) => ({ date: JD.parse(r.date) || JD.today(), cat: txt(r.cat) || 'سایر', amount: Math.max(0, money(r.amount) ?? 0), method: txt(r.method),
      center: txt(r.center), note: txt(r.note), recur: txt(r.recur), move: txt(r.move) }),
    recurring: (r) => ({ cat: txt(r.cat) || 'سایر', amount: Math.max(0, money(r.amount) ?? 0), day: Math.min(31, Math.max(1, num(r.day) || 1)), note: txt(r.note), active: r.active !== false }),
    items: (r) => ({ name: txt(r.name) || 'قلم', drug: txt(r.drug), kind: ['mg', 'dose', 'unit'].includes(r.kind) ? r.kind : 'unit', doseMg: num(r.doseMg),
      size: num(r.size) || 1, unit: txt(r.unit) || 'عدد', low: num(r.low), active: r.active !== false }),
    moves: (r) => ({ item: txt(r.item), date: JD.parse(r.date) || JD.today(), kind: ['buy', 'adjust', 'waste', 'use'].includes(r.kind) ? r.kind : 'adjust',
      qty: num(r.qty) || 0, cost: money(r.cost), exp: txt(r.exp), note: txt(r.note) }),
  };
  const AUDIT = new Set(['id', 'at', 'by', 'bn', 'u', 'eb', 'ebn', 'hist', 'void', 'del', 'ok']);
  const TRACK = { appts: ['date', 'time', 'status', 'svc', 'vid', 'cid', 'center'], charges: ['amount', 'unit', 'qty', 'disc', 'svc', 'vid', 'date', 'cid', 'pkg'],
    payments: ['amount', 'method', 'date', 'cid', 'kind'], expenses: ['amount', 'cat', 'date'], clients: ['first', 'last', 'phone', 'disc'], services: ['price', 'variants', 'active'] };

  // ------------------------------------------------------------------ تکه‌ها (برای همگام‌سازی سبک: هر هفته یک فایل)
  /** شنبه همان هفته (هفته شمسی از شنبه شروع می‌شود). ۱۹۷۰/۰۱/۰۱ پنجشنبه است → روز ۲ شنبه. */
  function weekStart(date) { const n = JD.dayOf(date); if (n === null) return null; return n - (((n - 2) % 7) + 7) % 7; }
  function shardKey(col, rec) {
    if (BASE_COLS.includes(col)) return 'base';
    if (col === 'clients') return `c-${String(rec.id || '0').charAt(0).toLowerCase()}`;

  }

  // ------------------------------------------------------------------ ذخیره روی گوشی (IndexedDB)
  function makeStore(dbName) {
    let db = null;

    function open() {
      if (db || !root.indexedDB) return Promise.resolve(db);
      return new Promise((res) => {
        let rq;
        try { rq = root.indexedDB.open(dbName, 1); } catch (e) { res(null); return; }
        rq.onupgradeneeded = () => { if (!rq.result.objectStoreNames.contains('kv')) rq.result.createObjectStore('kv'); };
        rq.onsuccess = () => { db = rq.result; db.onversionchange = () => { try { db.close(); } catch (e) { /* بی‌اثر */ } db = null; }; res(db); };
        rq.onerror = () => res(null); rq.onblocked = () => res(null);

      async get(k) { const d = await open(); if (!d) return mem.get(k); return new Promise((res, rej) => { const rq = d.transaction('kv', 'readonly').objectStore('kv').get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); }); },
      async set(k, v) { const d = await open(); if (!d) { mem.set(k, v); return true; } return new Promise((res) => { let tx; try { tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); } catch (e) { res(false); return; } tx.oncomplete = () => res(true); tx.onerror = () => res(false); tx.onabort = () => res(false); }); },
      async del(k) { const d = await open(); if (!d) { mem.delete(k); return true; } return new Promise((res) => { const tx = d.transaction('kv', 'readwrite'); tx.objectStore('kv').delete(k); tx.oncomplete = () => res(true); tx.onerror = () => res(false); }); },
      get persistentOk() { return !!db; },
    };
  }

  // ------------------------------------------------------------------ دفتر
  class Ledger {
    constructor(id, store) {
      this.id = id; this.store = store; this.c = {};
      for (const k of COLS) this.c[k] = new Map();
      this.sync = { shas: {}, dirty: [], at: 0 };
      this.listeners = new Set(); this.timer = null; this.loaded = false; this.minCount = 0; this.readonly = false; this.batching = 0; this.pending = null;
    }

        if (o.sync) this.sync = Object.assign({ shas: {}, dirty: [], at: 0 }, o.sync);

      this.loaded = true;
    }
    snapshot() {
      const col = {};
      for (const k of COLS) col[k] = Array.from(this.c[k].values());
      return { format: FORMAT, v: VERSION, id: this.id, savedAt: now(), col, sync: this.sync };
    }
    scheduleSave() { clearTimeout(this.timer); this.timer = setTimeout(() => this.saveNow(), 250); }
    async saveNow() {
      clearTimeout(this.timer); this.timer = null;
      if (this.readonly) return false;
      const n = this.total();
      if (n < this.minCount) { this.guard = { had: this.minCount, now: n }; this.emit('guard'); return false; }   // هیچ‌وقت رکوردی گم نشود
      const ok = await this.store.set(`ledger:${this.id}`, this.snapshot());
      if (ok) this.minCount = n; else this.emit('save-error');

    }
    markDirty(key) { if (!this.sync.dirty.includes(key)) this.sync.dirty.push(key); this.rev = (this.rev || 0) + 1; (this.dirtyRev || (this.dirtyRev = {}))[key] = this.rev; }
    /** بعد از ارسال موفق: اگر از زمان ساخت محتوا تغییری نیامده، تکه دیگر «تغییرکرده» نیست */
    cleanIf(key, rev) { if (((this.dirtyRev || {})[key] || 0) <= rev) this.sync.dirty = this.sync.dirty.filter((k) => k !== key); }
    revOf(key) { return (this.dirtyRev || {})[key] || 0; }
    changed(reason, keys) { for (const k of keys || []) this.markDirty(k); this.scheduleSave(); this.emit(reason); }

    // ---------------------------------------------------------------- خواندن
    get(col, id) { const r = this.c[col].get(id); return live(r) ? r : null; }
    raw(col, id) { return this.c[col].get(id) || null; }

/* ---- qr.js ---- */
/* ساخت تصویر QR (برای کد راه‌اندازی گوشی منشی) و اسکن با دوربین در جایی که مرورگر BarcodeDetector دارد (کروم اندروید) */
(function (root) {
  'use strict';
  const ECL = { L: 1, M: 0, Q: 3, H: 2 };
  function matrix(text, ecl) {
    const q = new root.QRCodeImpl(-1, ECL[ecl || 'M'] ?? 0);
    q.addData(text);
    q.make();
    const n = q.getModuleCount();
    const rows = [];
    for (let r = 0; r < n; r++) { const row = []; for (let c = 0; c < n; c++) row.push(q.isDark(r, c)); rows.push(row); }
    return rows;
  }
  function svg(text, o) {
    const rows = matrix(text, o && o.ecl);
    const n = rows.length, m = (o && o.margin !== undefined) ? o.margin : 4;
    let d = '';
    rows.forEach((row, r) => row.forEach((dark, c) => { if (dark) d += `M${c + m} ${r + m}h1v1h-1z`; }));
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n + 2 * m} ${n + 2 * m}" shape-rendering="crispEdges" role="img" aria-label="کد QR راه‌اندازی"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  async function canScan() {
    if (!('BarcodeDetector' in root) || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
    try { return (await root.BarcodeDetector.getSupportedFormats()).includes('qr_code'); } catch (e) { return false; }
  }
  /** دوربین پشت را باز می‌کند و اولین QR را برمی‌گرداند؛ stop() برای بستن */
  function scan(video) {
    let stream = null, stopped = false;
    const done = new Promise((resolve, reject) => {
      (async () => {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' }, audio: false });
          video.srcObject = stream; video.setAttribute('playsinline', ''); await video.play();
          const det = new root.BarcodeDetector({ formats: ['qr_code'] });
          while (!stopped) {
            const codes = await det.detect(video).catch(() => []);
            if (codes && codes.length && codes[0].rawValue) { resolve(codes[0].rawValue); break; }
            await new Promise((r) => setTimeout(r, 250));
          }
        } catch (e) { reject(e); }
        finally { if (stream) stream.getTracks().forEach((t) => t.stop()); }
      })();
    });
    return { done, stop() { stopped = true; if (stream) stream.getTracks().forEach((t) => t.stop()); } };
  }

  function wireForm(box, onChange) {

  const formTop = (title, back) => `<button type="button" class="backbtn" data-oback>→ ${esc(back || 'برگشت')}</button><div class="view-head"><h2>${esc(title)}</h2></div>`;

  // ------------------------------------------------------------------ یادآوری‌ها (بدون نیاز به پرونده پزشکی: از نوبت‌ها و خدمت‌ها)
  function reminderData() {
    const Lx = L();
    const t = today(), td = JD.dayOf(t), tom = JD.addDays(t, 1);
    const tomorrow = Lx.all('appts', (a) => a.date === tom && a.status === 'booked');
    const future = new Set(Lx.all('appts', (a) => JD.dayOf(a.date) >= td && ['booked', 'arrived'].includes(a.status)).map((a) => a.cid));
    const injSvc = new Set(Lx.all('services', (s) => s.kind === 'inj').map((s) => s.id));
    const last = new Map(), count = new Map();
    for (const ch of Lx.all('charges', (x) => injSvc.has(x.svc) && !x.pkgN)) {
      const d = JD.dayOf(ch.date);
      if (!last.has(ch.cid) || d > last.get(ch.cid)) last.set(ch.cid, d);
      count.set(ch.cid, (count.get(ch.cid) || 0) + 1);
    }
    const late = [], lost = [];
    for (const [cid, d] of last) {
      const c = Lx.get('clients', cid);
      if (!c || future.has(cid)) continue;
      if (c.fuDate && JD.dayOf(c.fuDate) >= d && td - JD.dayOf(c.fuDate) < 14) continue;
      if (c.endDate && JD.dayOf(c.endDate) >= d) continue;
      const since = td - d;
      if (since > 28 && since <= 180 && count.get(cid) >= 2) lost.push({ c, since });
      else if (since >= 10 && since <= 28) late.push({ c, since });
    }
    return { tomorrow, late: late.sort((a, b) => a.since - b.since), lost: lost.sort((a, b) => a.since - b.since) };
  }
  function reminderCounts() { try { const r = reminderData(); return { tomorrow: r.tomorrow.filter((a) => !a.remind).length, late: r.late.length, lost: r.lost.length, total: r.tomorrow.filter((a) => !a.remind).length + r.late.length + r.lost.length }; } catch (e) { return { total: 0 }; } }
